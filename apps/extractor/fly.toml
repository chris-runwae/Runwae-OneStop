# Fly.io config for @runwae/extractor.
#
# Rename `app` below before the first `flyctl launch` — names are
# globally unique across Fly. Run `flyctl launch --no-deploy
# --copy-config` and accept this file when prompted.

app = "runwae-extractor"
primary_region = "lhr"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle so we pay $0 for unused minutes. Convex
  # calls the route only during a trip-from-link generation, so the
  # ~1s cold start on the first call of an idle hour is acceptable.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    # yt-dlp downloads are I/O-heavy and short. 10 concurrent
    # requests on a 1 vCPU machine is comfortable; raise after
    # measuring real traffic.
    soft_limit = 10
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
